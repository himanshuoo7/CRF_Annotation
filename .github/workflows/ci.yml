name: CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: optimized_crf

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff
      - name: Lint
        run: ruff check crf_annotation tests
      - name: Test
        run: pytest -q
        # No ANTHROPIC_API_KEY is set: the AI tier must degrade to the
        # deterministic tiers and the suite must still pass. That is the
        # property being asserted, not an omission.
